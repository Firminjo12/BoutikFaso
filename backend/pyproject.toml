[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boutik-faso-api"
version = "0.1.0"
description = "API de gestion de stock et des ventes de Boutik Faso"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "Pillow>=11.0,<13.0",
    "pydantic-settings>=2.7,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
